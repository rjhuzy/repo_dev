<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<title>Greetings Widget</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000; /* dark background */
        font-family: "DM Sans", sans-serif;
    }

    .widget {
        padding: 20px 30px;
        color: #ffffff;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .greet {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .date {
        font-size: 14px;
        margin-bottom: 10px;
        opacity: 0.8;
    }

    .clock {
        font-size: 18px;
        letter-spacing: 1px;
    }

    .time {
        display: inline-block;
        min-width: 25px;
    }
</style>

</head>
<body>

<div class="widget">
    <div class="greet" id="greet"></div>
    <div class="date" id="date"></div>
    <div class="clock">
        <span class="time" id="hour"></span> :
        <span class="time" id="min"></span> :
        <span class="time" id="sec"></span>
    </div>
</div>

<script>
function displayGreetings(today) {
    let hrs = today.getHours();
    let name = "Huzy";
    let greet;

    if (hrs < 12)
        greet = 'Good Morning ' + name;
    else if (hrs < 17)
        greet = 'Good Afternoon ' + name;
    else
        greet = 'Good Evening ' + name;

    document.getElementById('greet').innerHTML = greet;
}

function displayDate(today) {
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ["January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"];

    let text = `${days[today.getDay()]}, ${months[today.getMonth()]} ${today.getDate()} ${today.getFullYear()}`;
    document.getElementById('date').innerHTML = text;
}

function displayClock(today) {
    let hour = twelveHour(today.getHours());
    let min = padZeros(today.getMinutes());
    let sec = padZeros(today.getSeconds());
    let period = today.getHours() >= 12 ? "PM" : "AM";

    document.getElementById('hour').innerHTML = padZeros(hour);
    document.getElementById('min').innerHTML = min;
    document.getElementById('sec').innerHTML = sec + " " + period;
}

function twelveHour(hour) {
    return hour % 12 || 12;
}

function padZeros(num) {
    return num < 10 ? '0' + num : num;
}

function displayWidget() {
    let today = new Date();
    displayGreetings(today);
    displayDate(today);
    displayClock(today);
    setTimeout(displayWidget, 1000);
}

displayWidget();
</script>

</body>
</html>
